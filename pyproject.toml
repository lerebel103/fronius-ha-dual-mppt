[project]
name = "fronius-ha-dual-mppt"
version = "0.1.0"
requires-python = ">=3.14"

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hypothesis]
database_backend = "directory"
