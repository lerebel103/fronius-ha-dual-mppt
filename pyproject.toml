[project]
name = "fronius-ha-dual-mppt"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "pysunspec2==1.3.7",
    "paho-mqtt==2.1.0",
    "PyYAML==6.0.3",
    "pyserial==3.5",
]

[dependency-groups]
dev = [
    "hypothesis==6.170.13",
    "pytest==9.2.0",
    "ruff==0.17.3",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.hypothesis]
database_backend = "directory"
